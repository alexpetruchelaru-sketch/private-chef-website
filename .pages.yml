# Pages CMS configuration (pagescms.org).
# Sign in at app.pagescms.org with GitHub, pick this repository, and the
# fields below become a form. Saving commits the JSON and Cloudflare rebuilds.
media:
  input: img/recipes
  output: /img/recipes
content:
  - name: recipes
    label: Recipes
    type: collection
    path: content/recipes
    filename: '{fields.title}.json'
    format: json
    view:
      fields: [title, subtitle, date]
      primary: title
    fields:
      - { name: title, label: Recipe name, type: string, required: true }
      - { name: subtitle, label: One-line subtitle, type: string }
      - { name: summary, label: Summary, type: text, required: true,
          description: Two or three sentences. This is what Google shows in search results. }
      - { name: intro, label: Introduction, type: text,
          description: The bit before the recipe. Why you cook it this way. }
      - { name: image, label: Photo, type: image,
          description: The finished dish. Google will not show a recipe as a rich result without one. }
      - { name: imageAlt, label: Photo description, type: string,
          description: What is in the photo, for search and for screen readers. }
      - { name: ingredients, label: Ingredients, type: string, list: true, required: true }
      - { name: steps, label: Method, type: text, list: true, required: true }
      - { name: chefNote, label: Chef's note, type: text }
      - { name: servesWith, label: Serve it with, type: string }
      - { name: yield, label: Serves, type: string }
      - { name: prepMinutes, label: Prep time in minutes, type: number }
      - { name: cookMinutes, label: Cook time in minutes, type: number }
      - { name: category, label: Course, type: select,
          options: { values: [Starter, Main, Side, Dessert, Sauce, Breakfast, Snack] } }
      - { name: cuisine, label: Cuisine, type: string, default: Canarian }
      - { name: keywords, label: Search keywords, type: string,
          description: Comma separated. What someone would type into Google to find this. }
      - { name: date, label: Date published, type: date, required: true }
